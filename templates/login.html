<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In — Simple NCLEX Platform</title>
  <meta name="description" content="Log in to your Simple NCLEX Platform account."/>
  <link rel="icon" type="image/png" href="/static/images/favicon.png"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="stylesheet" href="/static/css/auth.css"/>
</head>
<body class="auth-page-simple">
  <div class="auth-simple-box">

    <!-- Brand Header -->
    <div class="auth-simple-header">
      <a href="index.html" class="auth-brand" style="justify-content:center;margin-bottom:0.85rem;text-decoration:none">
        <img src="/static/images/logo.png" alt="Simple NCLEX Platform Logo" class="auth-logo-img"/>
        <span style="color:var(--text-title);font-size:1.3rem;font-weight:800">Simple NCLEX Platform</span>
      </a>
      <h1 style="font-size:1.65rem;font-weight:800;color:var(--text-title);margin:0 0 0.35rem">Welcome Back</h1>
      <p style="font-size:0.9rem;color:var(--text-muted);margin:0">Log in to continue your nursing exam preparation</p>
    </div>

    <!-- Login Card -->
    <div class="auth-simple-card">
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-icon-wrap">
            <span class="icon">✉️</span>
            <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" autocomplete="email" required/>
          </div>
          <p class="field-error" id="emailError"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-icon-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password" required/>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">👁️</button>
          </div>
          <p class="field-error" id="pwError"></p>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.85rem;font-weight:700;margin-top:0.5rem" id="loginBtn">
          <span id="loginBtnText">Log In →</span>
          <span id="loginSpinner" class="spinner hidden"></span>
        </button>
      </form>

      <div style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border-light);text-align:center;font-size:0.9rem">
        <span style="color:var(--text-muted)">Don't have an account?</span>
        <a href="register.html" class="auth-link" style="font-weight:700;margin-left:0.25rem">Sign Up Free →</a>
      </div>
    </div>

    <div class="auth-simple-footer">
      <a href="index.html" style="color:var(--text-muted);text-decoration:none;font-size:0.85rem;display:inline-flex;align-items:center;gap:0.35rem">
        ← Back to Simple NCLEX Platform Home
      </a>
    </div>

  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
